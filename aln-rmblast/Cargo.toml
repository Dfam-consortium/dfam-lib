[package]
name = "aln-rmblast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rmblast search-engine backend for the Dfam/GIRI alignment stack"

[dependencies]
aln-core.workspace = true
aln-engine.workspace = true
rayon.workspace = true
anyhow = "1"

# The Rust port of rmblast, pinned to a release tag rather than taken from a
# sibling checkout, so this builds from any directory layout.
#
# Bump the tag on an RMBlast release, then run `cargo update -p rmblast-lib` to
# move the workspace lockfile with it.
#
# rmblast-lib's default `alp-fit` feature compiles the ALP sources vendored in
# that repository, so it needs a C++ compiler; aln-parasail already requires a C
# one for its own vendored sources.  Dropping the feature via
# `default-features = false` costs the last-resort Gumbel parameter fit in the
# E-value statistics hierarchy.  The line below leaves it on.
rmblast-lib = { git = "https://github.com/Dfam-consortium/RMBlast.git", tag = "3.0.6" }

# To develop against a local rmblast-port checkout, replace the line above with
# the path below.  A `[patch]` section is not a substitute: cargo resolves the
# git source first and applies the patch afterwards, so it still fetches the
# tag you are trying to bypass.
#
# rmblast-lib = { path = "../../../rmblast-port/rmblast/rmblast-lib" }
